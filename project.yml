name: Italingua
options:
  bundleIdPrefix: com.y6a9lrqdh7
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ru
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  Italingua:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Content
        type: folder
        buildPhase: resources
      # App icon made for Icon Composer (layers + icon.json); actool renders
      # the Liquid Glass variants for macOS and iOS.
      - path: Config/Italingua.icon
        type: file
        buildPhase: resources
    entitlements:
      path: Config/Italingua.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(ITALINGUA_CLOUDKIT_CONTAINER)]
        aps-environment: development
        com.apple.developer.aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Italingua
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's built-in encryption (HTTPS/CloudKit) is used: exempt.
        ITSAppUsesNonExemptEncryption: false
        ItalinguaCloudKitContainer: $(ITALINGUA_CLOUDKIT_CONTAINER)
        ItalinguaCodeSigned: $(CODE_SIGNING_ALLOWED)
        CFBundleDevelopmentRegion: ru
        # Interface languages; also what macOS uses for the app's system menus.
        CFBundleLocalizations: [ru, en, es]
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        LSApplicationCategoryType: public.app-category.education
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы отвечать в упражнениях голосом. Речь распознаётся на устройстве.
        NSSpeechRecognitionUsageDescription: Речь распознаётся на устройстве, чтобы проверить ответ, сказанный вслух.
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Italingua
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  ItalinguaTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Italingua
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.y6a9lrqdh7.italingua.tests
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Italingua.app/Contents/MacOS/Italingua
        TEST_HOST[sdk=iphone*]: $(BUILT_PRODUCTS_DIR)/Italingua.app/Italingua
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Italingua:
    build:
      targets:
        Italingua: all
        ItalinguaTests: [test]
    test:
      targets: [ItalinguaTests]
